<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라면질문 점프!</title>
<meta name="theme-color" content="#5cb8ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="common.css">
<style>
.logo{margin:0;font-size:clamp(40px,7vw,64px);font-weight:400;text-align:center;letter-spacing:.02em}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.panel{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:24px;font-weight:400}
.label{font-size:19px;color:var(--muted)}
.numgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:min(560px,86vw)}
.numgrid .btn{font-size:34px;min-height:76px;padding:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px}
.frame{border:3px solid var(--ink);border-radius:12px;background:var(--blue);box-shadow:0 4px 0 var(--ink);padding:10px 14px;text-align:left;min-height:52px;font-size:21px}
.frame:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ex{display:flex;gap:8px;font-size:20px;line-height:1.35}
.ex .ic{color:var(--red-ink);margin-top:3px}
.write{background:#fff;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.write textarea{border:0;outline:none;resize:none;background:transparent;font-size:26px;line-height:1.45;min-height:170px;width:100%}
.write .foot{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--muted)}
.sent{padding:12px 18px;display:flex;flex-direction:column;gap:6px}
.sent ol{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:4px;font-size:19px}
.qbox{padding:20px 26px;display:flex;gap:18px;align-items:center}
.qbox .q{font-size:clamp(26px,3.6vw,38px);line-height:1.3}
.qbox .ic{color:var(--ink);fill:var(--gold)}
.bobcoin{width:72px;height:72px;border-width:4px;animation:bob 1.1s ease-in-out infinite}
.status{display:flex;align-items:center;gap:8px;color:#1f7a35;font-size:19px}
.full{padding:22px;text-align:center;font-size:24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.wait-msg{padding:22px 34px;font-size:clamp(24px,3.4vw,34px)}
@media (max-width:820px){.cols{grid-template-columns:1fr}.wrap{padding:14px 14px 60px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top" id="hdr" hidden>
    <span class="badge" id="meBadge" style="font-size:26px"></span>
    <div class="title-shadow" id="phaseTitle" style="font-size:28px"></div>
    <div class="grow"></div>
    <div class="blk counter" id="coins" hidden></div>
    <button class="btn small" type="button" id="changeNum">번호 바꾸기</button>
  </header>
  <main id="main" style="flex:1;display:flex;flex-direction:column;gap:20px"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
"use strict";
const db = makeDB();
paintScenery();
if (db.demo) {
  const b = document.createElement("div"); b.className = "demo-bar";
  b.textContent = "체험 모드예요. 이 컴퓨터 안에서만 연결돼요. (config.js를 채우면 태블릿과 연결돼요)";
  document.body.prepend(b);
}

let num = LS.get("num", null);
let live = null, myQs = [], myAns = null;
let unsubQ = null, unsubA = null, qKey, aKey;
let screenKey = "", prefilled = false, sending = false;

db.watchLive(l => { live = l; syncSubs(); render(); });

function syncSubs() {
  const sid = live && live.sid;
  const qk = sid && num ? sid + "_" + num : null;
  if (qk !== qKey) {
    if (unsubQ) unsubQ(); unsubQ = null; myQs = []; qKey = qk;
    if (qk) unsubQ = db.watchQuestions(sid, qs => { myQs = qs; update(); }, num);
  }
  const ak = qk && live.round ? sid + "_" + live.round + "_" + num : null;
  if (ak !== aKey) {
    if (unsubA) unsubA(); unsubA = null; myAns = null; aKey = ak; prefilled = false;
    if (ak) unsubA = db.watchAnswer(sid, live.round + "_" + num, a => { myAns = a; update(); });
  }
}

function view() {
  if (!num) return "num";
  if (!live || !live.sid) return "wait";
  if (live.phase === "end") return "end";
  if (["write", "pick", "answer"].includes(live.phase)) return live.phase;
  return "wait";
}
const nStudents = () => (live && live.studentCount) || DEFAULTS.studentCount;

function render() {
  const v = view();
  const key = [v, num, nStudents(), live && live.sid, live && live.round, live && live.accepting,
    v === "write" ? JSON.stringify([live.frames, live.examples]) : "", v === "answer" ? live.question && live.question.text : ""].join("|");
  if (key !== screenKey) { screenKey = key; build(v); }
  update();
}

const TITLES = { write: "질문 쓰기 스테이지", pick: "잠깐 기다려요", answer: "답하기 스테이지", wait: "라면질문 점프!", end: "게임 끝!" };

function build(v) {
  const main = $("#main");
  $("#hdr").hidden = v === "num";
  if (v !== "num") { $("#meBadge").textContent = num + "번"; $("#phaseTitle").textContent = TITLES[v]; }

  if (v === "num") {
    let b = "";
    for (let i = 1; i <= nStudents(); i++) b += `<button class="btn" type="button" data-n="${i}">${i}</button>`;
    main.innerHTML = `<div class="center">
      <h1 class="logo title-shadow">라면질문 점프!</h1>
      <div class="blk panel" style="align-items:center"><h2>내 번호를 눌러요</h2><div class="numgrid">${b}</div></div></div>`;
    $$("[data-n]", main).forEach(el => el.onclick = () => {
      num = +el.dataset.n; LS.set("num", num); syncSubs(); screenKey = ""; render();
    });
    return;
  }

  if (v === "wait" || v === "end") {
    const end = v === "end";
    main.innerHTML = `<div class="center">
      <h1 class="logo title-shadow">${end ? "오늘 게임 끝!" : "라면질문 점프!"}</h1>
      <div class="coin bobcoin"></div>
      <div class="blk wait-msg">${end ? "모두 수고했어요! 멋진 질문과 답이었어요." : "선생님이 게임을 시작하면 열려요!"}</div></div>`;
    return;
  }

  if (v === "write") {
    const frames = (live.frames && live.frames.length ? live.frames : DEFAULTS.frames);
    const examples = (live.examples && live.examples.length ? live.examples : DEFAULTS.examples);
    main.innerHTML = `<div class="cols">
      <div class="col">
        <div class="blk panel">
          <div class="label">문장틀 — 누르면 글쓰기 칸에 들어가요</div>
          ${frames.map((f, i) => `<button type="button" class="frame" data-f="${i}">${esc(f)}</button>`).join("")}
        </div>
        <div class="blk panel">
          <div class="label">이런 질문은 어때?</div>
          ${examples.map(e => `<div class="ex">${ic("star", 18, 'fill="#ffc93c"')}<span>${esc(e)}</span></div>`).join("")}
        </div>
      </div>
      <div class="col">
        <div id="writeArea" class="col">
          <div class="blk write">
            <label class="label" for="qText">내 라면질문</label>
            <textarea id="qText" maxlength="${MAXLEN}" placeholder="문장틀을 누르거나 직접 써 보세요"></textarea>
            <div class="foot"><span>빈칸 ____ 을 눌러서 채워요</span><span id="qLen">0 / ${MAXLEN}</span></div>
          </div>
          <button class="btn red big" type="button" id="qSend">${ic("send", 26)}질문 보내기!</button>
        </div>
        <div class="blk full" id="qFull" hidden>
          <div class="coin bobcoin"></div>
          <div>질문 ${MAXQ}개를 다 보냈어요!<br><span class="muted" style="font-size:19px">선생님이 질문을 고를 때까지 기다려요</span></div>
        </div>
        <div class="blk sent" id="sentBox" hidden><div class="label">보낸 질문</div><ol id="sentList"></ol></div>
      </div></div>`;
    const ta = $("#qText");
    const len = () => { $("#qLen").textContent = ta.value.length + " / " + MAXLEN; };
    ta.oninput = len;
    ta.onclick = () => { // 빈칸을 누르면 그 빈칸이 선택돼요
      if (ta.selectionStart !== ta.selectionEnd) return;
      const p = ta.selectionStart, v = ta.value;
      const re = /_{2,}/g; let m;
      while ((m = re.exec(v))) { if (p >= m.index && p <= m.index + m[0].length) { ta.setSelectionRange(m.index, m.index + m[0].length); break; } }
    };
    $$("[data-f]", main).forEach(el => el.onclick = () => {
      const f = frames[+el.dataset.f];
      ta.value = f.slice(0, MAXLEN); len(); ta.focus();
      const i = ta.value.indexOf("__");
      if (i >= 0) { let j = i; while (ta.value[j] === "_") j++; ta.setSelectionRange(i, j); }
    });
    $("#qSend").onclick = sendQuestion;
    return;
  }

  if (v === "pick") {
    main.innerHTML = `<div class="center">
      <div class="coin bobcoin"></div>
      <div class="blk wait-msg">선생님이 질문을 고르고 있어요!<br><span class="muted" style="font-size:22px">어떤 질문이 뽑힐까?</span></div>
      <div class="blk sent" id="sentBox" hidden style="max-width:640px;text-align:left"><div class="label">내가 보낸 질문</div><ol id="sentList"></ol></div></div>`;
    return;
  }

  if (v === "answer") {
    const q = live.question || {};
    main.innerHTML = `
      <div class="blk qbox">${ic("star", 46)}<div class="q">${esc(q.text)}</div></div>
      <div id="ansOpen" class="col" style="max-width:900px;width:100%;margin:0 auto">
        <div class="blk write">
          <label class="label" for="aText">내 답</label>
          <textarea id="aText" maxlength="${MAXLEN}" placeholder="여기에 내 생각을 써요" style="min-height:140px"></textarea>
          <div class="foot"><span id="aStatus"></span><span id="aLen">0 / ${MAXLEN}</span></div>
        </div>
        <button class="btn red big" type="button" id="aSend"></button>
      </div>
      <div id="ansClosed" class="blk full" hidden style="max-width:900px;width:100%;margin:0 auto"></div>`;
    const ta = $("#aText");
    ta.oninput = () => { $("#aLen").textContent = ta.value.length + " / " + MAXLEN; };
    $("#aSend").onclick = sendAnswer;
  }
}

function update() {
  const v = view();
  // 헤더 동전: 보낸 질문 수
  const coins = $("#coins");
  coins.hidden = v !== "write";
  if (v === "write") {
    let c = `<span style="font-size:18px">보낸 질문</span>`;
    for (let i = 0; i < MAXQ; i++) c += `<span class="coin${i < myQs.length ? "" : " off"}"></span>`;
    coins.innerHTML = c;
  }
  const sb = $("#sentBox");
  if (sb) {
    sb.hidden = !myQs.length;
    $("#sentList").innerHTML = myQs.map(q => `<li>${esc(q.text)}</li>`).join("");
  }
  if (v === "write") {
    const full = myQs.length >= MAXQ;
    $("#writeArea").hidden = full; $("#qFull").hidden = !full;
  }
  if (v === "answer") {
    const open = live.accepting !== false;
    $("#ansOpen").hidden = !open; $("#ansClosed").hidden = open;
    if (open) {
      const ta = $("#aText");
      if (!prefilled && myAns) { ta.value = myAns.text || ""; ta.oninput(); prefilled = true; }
      $("#aSend").innerHTML = myAns ? ic("pencil", 24) + "고쳐서 다시 보내기" : ic("send", 26) + "답 보내기!";
      $("#aStatus").innerHTML = myAns ? `<span class="status">${ic("check", 20)}보냈어요! 선생님이 멈추기 전까지 고칠 수 있어요</span>` : "";
    } else {
      $("#ansClosed").innerHTML = `<div style="font-size:28px">답 받기가 끝났어요!</div>` +
        (myAns ? `<div class="muted" style="font-size:20px">내 답</div><div style="font-size:24px">${esc(myAns.text)}</div>`
               : `<div class="muted" style="font-size:20px">이번 질문에는 답을 보내지 않았어요</div>`);
    }
  }
}

async function sendQuestion() {
  if (sending) return;
  const ta = $("#qText"), text = ta.value.trim();
  if (!text) return toast("질문을 먼저 써 주세요");
  if (/_{2,}/.test(text)) return toast("빈칸 ____ 을 채워 주세요");
  if (myQs.length >= MAXQ) return toast(`질문은 ${MAXQ}개까지 보낼 수 있어요`);
  sending = true; $("#qSend").disabled = true;
  try {
    await db.addQuestion(live.sid, { num, text: text.slice(0, MAXLEN), at: Date.now(), hidden: false });
    ta.value = ""; ta.oninput(); toast("질문을 보냈어요!");
  } catch (e) { onErr(e); }
  sending = false; const b = $("#qSend"); if (b) b.disabled = false;
}

async function sendAnswer() {
  if (sending) return;
  const ta = $("#aText"), text = ta.value.trim();
  if (!text) return toast("답을 먼저 써 주세요");
  if (myAns && myAns.text === text) return toast("이미 보낸 답과 같아요");
  sending = true; $("#aSend").disabled = true;
  const round = live.round;
  const data = myAns ? { text: text.slice(0, MAXLEN), editedAt: Date.now() }
    : { round, num, qid: (live.question && live.question.id) || "", text: text.slice(0, MAXLEN), at: Date.now(), revealed: false };
  try { await db.setAnswer(live.sid, round + "_" + num, data); prefilled = true; toast(myAns ? "고친 답을 보냈어요!" : "답을 보냈어요!"); }
  catch (e) { onErr(e); }
  sending = false; const b = $("#aSend"); if (b) b.disabled = false;
}

$("#changeNum").onclick = () => {
  if (!confirm(num + "번이 아니에요? 번호를 다시 고를까요?")) return;
  num = null; LS.set("num", null); syncSubs(); screenKey = ""; render();
};

render();
</script>
</body>
</html>
